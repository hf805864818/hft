name: Build TrollStore IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # 允许手动触发

jobs:
  build:
    name: macOS build + sign
    runs-on: macos-14     # macos-14 自带 Xcode，可编译 iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xcodegen (fallback)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi

      - name: Build & sign IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash Scripts/build_ipa.sh

      - name: Show output
        run: ls -lh dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraeResetiOS-b${{ github.run_number }}
          path: |
            TraeResetiOS-TrollStore.ipa
            dist/TraeResetiOS-b${{ github.run_number }}-TrollStore.ipa
          if-no-files-found: error
